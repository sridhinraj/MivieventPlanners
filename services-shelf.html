<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mivi Events — What We Do · The 3D Event Production Shelf</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/aftika" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/gilroy-bold" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@qpokychuk/gilroy@1.0.2/index.min.css">
<style>
  :root{
    --bg:#120308;
    --ink:#f5eee1;
    --ink-soft:rgba(245,238,225,.7);
    --gold:#d4af37;
    --gold-light:#f7ecb5;
    --gold-gradient:linear-gradient(135deg, #f7ecb5 0%, #d4af37 50%, #997510 100%);
    --ease:cubic-bezier(.22,1,.36,1);
    --font-serif:"Aftika", "Playfair Display", Georgia, serif;
    --font-sans:"Gilroy", "Gilroy-Medium", Inter, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#0a0104;color:var(--ink);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    opacity:0;transition:opacity 1s linear}
  canvas#gl.on{opacity:1}

  /* ---------- header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;height:60px;z-index:20;
    display:flex;align-items:center;padding:0 20px;gap:28px;
    font-size:16px;font-weight:500;
  }
  .brand{display:inline-flex;align-items:center;gap:12px;vertical-align:middle}
  .mark{width:28px;height:28px;border-radius:50%;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .mark svg{width:15px;height:15px;fill:#efe7da;display:block}
  .brandname{font-family:var(--font-serif);font-size:22px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;display:inline-flex;align-items:center;line-height:1}
  header .right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .pill{background:var(--ink);color:#f6efe1;padding:11px 20px;border-radius:999px;
    text-decoration:none;white-space:nowrap}
  .pill:hover{background:#33291f}

  /* ---------- the opening: every element on its own beat ---------- */
  .rise{opacity:0;transform:translateY(13px);
    transition:opacity .74s var(--ease) var(--d,0ms),transform .74s var(--ease) var(--d,0ms)}
  .rise.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    .rise{transform:none;transition:opacity .3s linear var(--d,0ms)}
  }

  /* ---------- focused volume panel ---------- */
  .wash{position:fixed;left:0;top:0;z-index:14;height:100vh;
    width:min(664px,62vw);pointer-events:none;display:block}
  body.mobile .wash{display:none}
  .detail{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:15;
    width:min(560px,50vw);padding:92px 120px 92px 54px;opacity:0;pointer-events:none;
    transition:opacity .45s var(--ease) .14s}
  .detail .meta,.detail h2,.detail p,.detail .acts{max-width:340px}
  .detail.on{opacity:1}
  .detail .acts button{pointer-events:auto}
  .detail .meta{font-size:13px;letter-spacing:.15em;text-transform:uppercase;
    color:#734e19;font-weight:700;margin:0 0 13px;text-shadow:0 1px 1px rgba(255,255,255,0.4)}
  .detail h2{font-family:var(--font-serif);font-weight:700;
    font-size:46px;line-height:1.06;margin:0 0 18px;letter-spacing:-.01em;
    color:#18060d;text-shadow:0 1px 2px rgba(255,255,255,0.3)}
  .detail p{font:500 17px/1.62 Inter,sans-serif;margin:0 0 32px;color:#2c1b12}
  .detail .acts{display:flex;align-items:center;gap:10px}
  .detail .acts button{
    font:600 14.5px/1 Inter,sans-serif;color:#1a040b;background:#fefbf4;border:1.5px solid rgba(138,103,24,.35);
    border-radius:999px;padding:15px 24px;cursor:pointer;
    transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .22s,color .22s,border-color .22s;
    box-shadow:0 2px 4px rgba(52,34,16,.14),
               0 8px 18px -4px rgba(52,34,16,.22),
               inset 0 1px 0 rgba(255,255,255,.9)}
  .detail .acts button#detail-look{
    background:#16040a;color:#fceeb5;border:1.5px solid #d4af37;
    box-shadow:0 4px 16px rgba(18,2,8,.35),0 2px 4px rgba(212,175,55,.2);
  }
  .detail .acts button#detail-look:hover{
    background:#2c0814;color:#ffffff;transform:translateY(-2px);
    box-shadow:0 6px 22px rgba(18,2,8,.45),0 0 16px rgba(212,175,55,.45);
  }
  .detail .acts button#detail-close{
    background:#f4ece0;color:#28150c;border:1.5px solid rgba(115,78,25,.3);
  }
  .detail .acts button#detail-close:hover{
    background:#ffffff;color:#0a0204;border-color:rgba(115,78,25,.6);transform:translateY(-2px);
    box-shadow:0 4px 14px rgba(52,34,16,.25);
  }
  .detail .acts button:active{transform:translateY(0);
    box-shadow:0 1px 2px rgba(52,34,16,.22),0 4px 10px -2px rgba(52,34,16,.24)}

  @media (max-width: 768px) {
    .wash {
      width: 100vw;
      background: radial-gradient(circle at 50% 80%, rgba(206,186,157,.95) 0%, rgba(206,186,157,0) 80%);
    }
    .detail {
      left: 12px;
      right: 12px;
      top: auto;
      bottom: 74px;
      transform: none;
      width: auto;
      max-width: calc(100% - 24px);
      padding: 16px 20px;
      background: rgba(254, 251, 244, 0.96);
      border: 1.5px solid rgba(138, 103, 24, 0.4);
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(24, 6, 13, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .detail .meta, .detail h2, .detail p, .detail .acts {
      max-width: 100%;
    }
    .detail .meta {
      font-size: 11px;
      margin: 0 0 5px;
    }
    .detail h2 {
      font-size: 21px;
      margin: 0 0 6px;
      line-height: 1.15;
    }
    .detail p {
      font-size: 13px;
      line-height: 1.45;
      margin: 0 0 14px;
    }
    .detail .acts button {
      padding: 11px 18px;
      font-size: 13px;
    }
    footer {
      padding: 14px 0 10px;
    }
    .tlmark {
      width: 28px;
      height: 28px;
    }
    .tli p {
      font-size: 11px;
    }
    .tli h2 {
      font-size: 12.5px;
    }
  }

  .hint{position:fixed;z-index:16;left:0;top:0;transform:translate(10px,10px);
    background:#fdf8ef;color:var(--ink);border-radius:999px;padding:8px 13px;
    font:500 13.5px/1 Inter,sans-serif;box-shadow:0 2px 14px rgba(50,35,20,.2);
    pointer-events:none;opacity:0;transition:opacity .5s}
  .hint.on{opacity:1}

  /* ---------- catalogue rail ---------- */
  footer{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:30px 0 22px;
    background:linear-gradient(to top,rgba(198,174,142,.94) 46%,rgba(198,174,142,.62) 76%,rgba(198,174,142,0));
    border-top:1px solid rgba(36,26,18,.16);opacity:0;transition:opacity .7s var(--ease) .34s}
  footer.on{opacity:1}
  body.reading footer{opacity:.3}
  .tl{display:flex;justify-content:space-between;align-items:center;
    gap:clamp(9px,1.2vw,22px);padding:0 clamp(14px,2.5vw,44px);
    overflow-x:auto;overscroll-behavior-x:contain;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%)}
  .tl::-webkit-scrollbar{display:none}
  .tl>*{flex:0 1 auto;min-width:0}
  .tli{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;
    flex:0 0 auto;display:flex;align-items:center;gap:11px}
  .tlmark{flex:0 0 auto;width:36px;height:36px;object-fit:contain;opacity:.5;
    transition:opacity .4s var(--ease),transform .4s var(--ease)}
  .tli:hover .tlmark{opacity:.95;transform:translateY(-1px) scale(1.06)}
  .tltxt{display:block;min-width:0;white-space:nowrap}
  .tli p{margin:0;font-size:12.5px;line-height:1.24;color:var(--ink-soft);transition:color .45s}
  .tli p.studio{margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tli h2{margin:0;font-size:14px;font-weight:400;line-height:1.22;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tli:hover p{color:var(--ink)}

  /* ---------- mobile: the stack you flick through ---------- */
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:18;display:none;
    align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 16px 22px;
    opacity:0;transition:opacity .6s var(--ease)}
  .mbar.on{opacity:1}
  .mbar-txt p{margin:0 0 4px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#734e19;font-weight:700}
  .mbar-txt h2{margin:0;font-family:var(--font-serif);font-size:24px;font-weight:700;line-height:1.12;color:#18060d}
  .mbar-acts{display:flex;gap:8px;flex:0 0 auto}
  .mbar-acts button{font:600 14.5px/1 Inter,sans-serif;border:1.5px solid rgba(115,78,25,.3);border-radius:999px;
    padding:15px 21px;
    box-shadow:0 1px 1px rgba(52,34,16,.18),0 4px 9px rgba(52,34,16,.16),
               0 14px 26px -8px rgba(52,34,16,.30),inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer;background:#fefbf4;color:#18060d}
  .mbar-acts button.solid{background:#16040a;color:#fceeb5;border:1.5px solid #d4af37}
  .menubtn{position:fixed;right:14px;top:10px;z-index:22;width:34px;height:34px;border:0;
    background:none;display:none;flex-direction:column;justify-content:center;gap:6px;cursor:pointer}
  .menubtn span{display:block;height:1.8px;background:#18060d;border-radius:2px}
  .menu{position:fixed;inset:0;z-index:21;background:rgba(206,186,157,.97);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    padding:66px 20px 24px;display:flex;flex-direction:column;overflow:auto}
  .menu[hidden]{display:none}
  .menu button{background:none;border:0;text-align:left;padding:13px 4px;cursor:pointer;
    border-bottom:1px solid rgba(36,26,18,.14);color:var(--ink);
    font-family:var(--font-serif);font-size:21px}
  .menu button span{display:block;margin-bottom:4px;font-family:Inter,sans-serif;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}

  body.mobile footer{display:none}
  body.mobile .mbar{display:flex;padding-top:52px;
    background:linear-gradient(to top,rgba(198,174,142,.97) 34%,rgba(198,174,142,.72) 68%,rgba(198,174,142,0))}
  body.mobile .menubtn{display:flex}
  body.mobile header{padding:0 14px;gap:10px}
  body.mobile header .right{margin-right:42px}
  body.mobile .detail{display:none}
  .mbar{background:linear-gradient(to top, rgba(203,182,152,.96), rgba(203,182,152,0))}

  /* ---------- brand & header utilities ---------- */
  .mark-gold{background:var(--gold-gradient);color:#120308}
  .mark-svg{fill:#120308;width:16px;height:16px}
  .brandname-text{font-family:var(--font-serif);font-weight:700;letter-spacing:.08em}
  .brandname-text em{font-style:normal;color:var(--gold)}
  .header-right{display:flex;align-items:center;gap:10px}
  .pill-map{background:rgba(212,175,55,.18);border:1px solid rgba(212,175,55,.4);color:var(--gold-light)}
  .pill-cta{background:var(--gold-gradient);color:#0a0104;font-weight:600}
  .acts-wrap{display:flex;flex-wrap:wrap;gap:10px}
  .btn-map-gold{padding:15px 22px;border-radius:999px;background:var(--gold-gradient);color:#090104;font:600 14px/1 var(--font-sans);text-decoration:none;display:inline-flex;align-items:center;box-shadow:0 8px 24px rgba(212,175,55,.3)}

  /* ---------- loader ---------- */
  .loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
    background:var(--bg);transition:opacity .6s linear;pointer-events:none}
  .loader.gone{opacity:0;display:none!important;pointer-events:none!important}
  .bar{width:92px;height:2px;background:rgba(29,24,21,.2);position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:var(--ink);
    transition:transform .3s linear}

  /* ══════════════════════════════════════════════════════════════
     THE WEDDING LOOKBOOK MODAL — Meng To 3D Sketchbook Engine
     ══════════════════════════════════════════════════════════════ */
  .detail .acts button#detail-rotate {
    background: rgba(212, 175, 55, 0.14);
    color: #f7ecb5;
    border: 1.5px solid rgba(212, 175, 55, 0.55);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .detail .acts button#detail-rotate:hover {
    background: #2e0815;
    color: #ffffff;
    border-color: #d4af37;
    transform: translateY(-2px);
    box-shadow: 0 4px 18px rgba(212, 175, 55, 0.35);
  }
  .detail .acts button#detail-look {
    background: var(--gold-gradient);
    color: #0d0105;
    font-weight: 700;
    border: 1.5px solid #d4af37;
    box-shadow: 0 4px 18px rgba(212, 175, 55, 0.45);
  }
  .detail .acts button#detail-look:hover {
    background: #fff;
    color: #000;
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(212, 175, 55, 0.6);
  }

  /* Lookbook Modal Container */
  .lb-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s var(--ease);
  }
  .lb-modal.on {
    opacity: 1;
    pointer-events: auto;
  }
  .lb-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(10, 1, 4, 0.94);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
  }
  .lb-modal-card {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: clamp(14px, 2.5vw, 28px) clamp(16px, 3vw, 40px);
    box-sizing: border-box;
    overflow-y: auto;
  }

  /* Header inside Lookbook Modal */
  .lb-header {
    width: 100%;
    max-width: 1100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    flex-shrink: 0;
  }
  .lb-header-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .lb-kicker {
    font-family: var(--font-sans);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }
  .lb-title {
    margin: 0;
    font-family: var(--font-serif);
    font-size: clamp(20px, 2.8vw, 32px);
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
  }
  .lb-title em {
    font-style: normal;
    background: var(--gold-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .lb-vol-tag {
    font-family: var(--font-sans);
    font-size: 12px;
    color: rgba(244, 242, 239, 0.72);
    letter-spacing: 0.05em;
  }

  .lb-header-acts {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lb-fs-btn {
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(212, 175, 55, 0.12);
    border: 1px solid rgba(212, 175, 55, 0.4);
    color: var(--gold-light);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lb-fs-btn:hover {
    background: var(--gold);
    color: #000;
  }
  .lb-close-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 999px;
    background: #2a0815;
    border: 1px solid rgba(212, 175, 55, 0.5);
    color: #ffffff;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lb-close-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }
  .lb-close-btn:hover {
    background: var(--gold);
    color: #000;
    border-color: var(--gold);
    transform: scale(1.04);
  }

  /* 3D Sketchbook Engine Styles */
  .filter-svg-hidden { position: absolute; width: 0; height: 0; pointer-events: none; }
  .sb-wrap {
    display: grid;
    justify-items: center;
    gap: 12px;
    width: 100%;
    max-width: 1050px;
    position: relative;
    margin: auto 0;
  }
  .sb-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    position: relative;
    touch-action: pan-y;
  }
  .sb-arrow {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 12px;
    border: 0;
    background: transparent;
    color: var(--gold-light);
    cursor: pointer;
    transition: all 0.25s;
    z-index: 8;
    border-radius: 50%;
  }
  .sb-arrow:hover {
    color: #fff;
    background: rgba(212, 175, 55, 0.2);
    transform: scale(1.15);
  }

  .sb-3d {
    position: relative;
    flex: 1 1;
    min-width: 0;
    max-width: 820px;
    perspective: 1750px;
    perspective-origin: 50% 46%;
  }
  .sb-tilt {
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--zoom, 1));
    will-change: transform;
  }
  .sb-book {
    position: relative;
    width: 100%;
    aspect-ratio: 1760/1240;
    transform-style: preserve-3d;
    z-index: 1;
  }

  /* Shadows under turning book */
  .sb-cast { position: absolute; pointer-events: none; z-index: 0; }
  .sb-cast.ambient {
    left: 4%; right: 4%; top: 25%; bottom: 2%;
    background: radial-gradient(50% 50% at 50% 58%, rgba(212, 175, 55, 0.18) 0%, rgba(0, 0, 0, 0.55) 45%, rgba(0, 0, 0, 0) 75%);
    filter: blur(28px);
    opacity: calc(1 - var(--shade, 0) * 0.42);
  }
  .sb-cast.contact {
    left: 8%; right: 8%; top: 60%; bottom: 8%;
    background: radial-gradient(50% 44% at 50% 42%, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0) 80%);
    filter: blur(12px);
    opacity: calc(1 - var(--shade, 0) * 0.5);
  }
  .sb-cast.hair {
    left: 11%; right: 11%; top: 68%; bottom: 15%;
    background: radial-gradient(50% 52% at 50% 40%, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 78%);
    filter: blur(5px);
    opacity: calc(1 - var(--shade, 0) * 0.62);
  }
  .sb-full { position: absolute; inset: 0; }
  .sb-full img { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .sb-half { position: absolute; top: 0; bottom: 0; width: 50%; overflow-x: clip; overflow-y: visible; }
  .sb-half.left { left: 0; }
  .sb-half.right { left: 50%; }
  .sb-half-img { width: 200%; max-width: none; height: auto; display: block; }
  .sb-half-img.right { margin-left: -100%; }

  .gutter-shade {
    position: absolute; top: 0; bottom: 0; width: 46%;
    pointer-events: none; opacity: calc(var(--shade, 0) * 0.62);
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 5.2%, #000 94.8%, transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0, #000 5.2%, #000 94.8%, transparent 100%);
  }
  .gutter-shade.left { right: 0; background: linear-gradient(270deg, rgba(30, 10, 16, 0.4), rgba(0, 0, 0, 0) 82%); }
  .gutter-shade.right { left: 0; background: linear-gradient(90deg, rgba(30, 10, 16, 0.35), rgba(0, 0, 0, 0) 82%); }

  /* Turning leaf strip physics */
  .curl {
    position: absolute; top: 0; height: 100%;
    width: calc(var(--bw, 0px) * var(--span, 0.449));
    transform-style: preserve-3d; z-index: 6;
  }
  .curl.next { left: 50%; transform-origin: left center; transform: rotateY(calc(-1 * var(--tt, 0deg))); }
  .curl.prev { right: 50%; transform-origin: right center; transform: rotateY(var(--tt, 0deg)); }
  .strip {
    position: absolute; top: 0; height: 100%;
    width: calc(var(--bw, 0px) * var(--span, 0.449) / var(--n, 18));
    transform-style: preserve-3d;

function tracked(g,text,x,y,track,align){
  let w=0;for(const ch of text)w+=g.measureText(ch).width+track;w-=track;
  let cx = align==='center'? x-w/2 : align==='right'? x-w : x;
  const prev=g.textAlign;g.textAlign='left';
  for(const ch of text){g.fillText(ch,cx,y);cx+=g.measureText(ch).width+track;}
  g.textAlign=prev;return w;
}
function fitTracked(g,text,w,weight,family,track){
  let lo=4,hi=3000;
  const meas=px=>{g.font=`${weight} ${px}px ${family}`;let t=0;for(const ch of text)t+=g.measureText(ch).width+track*px;return t-track*px;};
  for(let i=0;i<26;i++){const m=(lo+hi)/2;if(meas(m)>w)hi=m;else lo=m;}
  g.font=`${weight} ${lo}px ${family}`;return lo;
}
function grain(g,W,H,amount,seed){
  try {
    const r=mulberry(seed||7);const img=g.getImageData(0,0,W,H),d=img.data;
    for(let i=0;i<d.length;i+=4){const n=(r()-0.5)*amount;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
    g.putImageData(img,0,0);
  } catch(e) {
    // Canvas may be tainted in local file:// or cross-origin iframe; skip pixel grain safely
  }
}
function cloth(g,W,H,seed,amt){
  const r=mulberry(seed||3);
  g.save();g.globalAlpha=amt===undefined?.05:amt;
  for(let y=0;y<H;y+=3){g.fillStyle=r()>.5?'#fff':'#000';g.fillRect(0,y,W,1);}
  for(let x=0;x<W;x+=3){g.fillStyle=r()>.5?'#fff':'#000';g.fillRect(x,0,1,H);}
  g.restore();
}
function rule(g,x0,y0,x1,y1,col,w){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();}

/* ---------- oak ---------- */
function woodTexture(px){
  const W=px, Hh=Math.round(px*0.5);
  const c=C(W,Hh),g=c.getContext('2d'),r=mulberry(909);
  g.fillStyle='#7d5228';g.fillRect(0,0,W,Hh);
  // sapwood/heartwood drift, kept low-contrast so it never reads as plywood
  for(let i=0;i<14;i++){
    g.fillStyle=`rgba(${146+r()*40|0},${98+r()*26|0},${48+r()*22|0},${.06+r()*.09})`;
    g.beginPath();g.ellipse(r()*W,r()*Hh,W*(.10+r()*.30),Hh*(.06+r()*.20),0,0,TAU);g.fill();
  }
  // the grain itself: many tight, slightly wandering lines
  for(let i=0;i<430;i++){
    const y0=r()*Hh, amp=Hh*(.004+r()*.020), f=0.6+r()*2.2, ph=r()*TAU;
    const dark=r()<.34;
    g.strokeStyle=dark
      ? `rgba(${38+r()*26|0},${22+r()*16|0},${9+r()*10|0},${.36+r()*.55})`
      : `rgba(${186+r()*40|0},${138+r()*32|0},${80+r()*26|0},${.14+r()*.32})`;
    g.lineWidth=dark?(0.8+r()*1.8):(0.8+r()*2.6);
    g.beginPath();
    for(let x=0;x<=W;x+=8){
      const y=y0+Math.sin(x/W*TAU*f+ph)*amp+Math.sin(x/W*TAU*f*2.7+ph*2)*amp*.4;
      x?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.stroke();
  }
  // cathedral figure — a few nested arcs, low contrast
  for(let k=0;k<4;k++){
    const cx=W*(.1+r()*.8), cy=Hh*(.15+r()*.7), sw=W*(.02+r()*.05);
    for(let i=0;i<14;i++){
      g.strokeStyle=`rgba(${62+r()*26|0},${38+r()*18|0},${16+r()*12|0},${.12+r()*.20})`;
      g.lineWidth=0.8+r()*1.6;
      g.beginPath();
      g.moveTo(cx-sw*(1+i*.30),cy+Hh*.5);
      g.quadraticCurveTo(cx,cy-Hh*(.12+i*.05),cx+sw*(1+i*.30),cy+Hh*.5);
      g.stroke();
    }
  }
  // medullary rays + open pores
  for(let i=0;i<520;i++){
    g.fillStyle=`rgba(${208+r()*26|0},${172+r()*28|0},${118+r()*28|0},${.05+r()*.15})`;
    g.fillRect(r()*W,r()*Hh,1+r()*2,Hh*(.01+r()*.05));
  }
  for(let i=0;i<9000;i++){
    g.fillStyle=`rgba(${44+r()*28|0},${26+r()*16|0},${10+r()*10|0},${.12+r()*.34})`;
    g.fillRect(r()*W,r()*Hh,1+r()*4,1);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;
  return t;
}

const WALL = {x0:-9.15,x1:9.15,y0:-9.67,y1:8.63};
const WT = {
  peak:231, bell:15, bellR:4.6, rightLift:4,
  vFall:20, vStart:0.70, vRange:3.2,
  bounce:38, bounceR:2.70, bouncePow:2.6,
  shTop:0.45, shTopR:2.40, shPow:2.3, shRightMul:0.68,
  shBot:0.50, shBotR:2.70, shBotRightMul:0.90,
  plankHalf:3.34, plankFeather:1.70,

/* tiling paper tooth — fibres, mottle and a fine grain */
function paperTexture(px){
  const c=C(px,px),g=c.getContext('2d'),r=mulberry(2027);
  g.fillStyle='#808080';g.fillRect(0,0,px,px);
  for(let i=0;i<70;i++){
    g.fillStyle=`rgba(${r()<.5?255:0},${r()<.5?255:0},${r()<.5?255:0},${.012+r()*.03})`;
    g.beginPath();g.ellipse(r()*px,r()*px,px*(.05+r()*.28),px*(.04+r()*.22),r()*TAU,0,TAU);g.fill();
  }
  for(let i=0;i<5200;i++){
    const x=r()*px,y=r()*px,l=1+r()*px*0.035,a=r()*TAU;
    g.strokeStyle=r()<.5?`rgba(255,255,255,${.03+r()*.11})`:`rgba(0,0,0,${.03+r()*.13})`;
    g.lineWidth=r()<.85?1:2;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  const img=g.getImageData(0,0,px,px),d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(r()-0.5)*40;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;
  t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;
  return t;
}
function wallTexture(px){
  const c=C(px,px),g=c.getContext('2d');
  const Ww=WALL.x1-WALL.x0, Hh=WALL.y1-WALL.y0;
  const img=g.createImageData(px,px), d=img.data;
  const PT=K.shelfTop, PB=[K.shelfTop[0]-K.plankThick, K.shelfTop[1]-K.plankThick];
  const sm=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
  const r=mulberry(5);
  for(let j=0;j<px;j++){
    const y = WALL.y1 - (j+0.5)/px*Hh;
    for(let i=0;i<px;i++){
      const x = WALL.x0 + (i+0.5)/px*Ww;
      const ax=Math.abs(x)/WT.bellR;
      let L = WT.peak - WT.bell*ax*ax + WT.rightLift*clamp(x/4,0,1);
      L -= WT.vFall*sm((WT.vStart-y)/WT.vRange)*sm((-x+2.8)/8.6);
      const inPlank = 1-sm((Math.abs(x)-WT.plankHalf)/WT.plankFeather);
      const inShadow = sm((x-WT.shLeft)/WT.shLeftFeather)*(1-sm((x-WT.shRight)/WT.shRightFeather));
      for(const pt of PT){
        const dy=y-pt; if(dy<0||dy>WT.bounceR) continue;
        L += WT.bounce*Math.pow(1-dy/WT.bounceR,WT.bouncePow)*inPlank;
      }
      const rb=sm((x+4.8)/9.6);
      let dy=PB[0]-y;
      if(dy>0&&dy<WT.shTopR) L *= 1-WT.shTop*(1-(1-WT.shRightMul)*rb)*Math.pow(1-dy/WT.shTopR,WT.shPow)*inShadow;
      dy=PB[1]-y;
      if(dy>0&&dy<WT.shBotR) L *= 1-WT.shBot*(1-(1-WT.shBotRightMul)*rb)*Math.pow(1-dy/WT.shBotR,WT.shPow)*inShadow;
      // the uprights sit proud of the wall and drop a soft edge shadow
      for(const ux of [-3.40,3.40]){
        const dx=x-ux;
        const s=Math.exp(-Math.pow((dx+ (ux<0?0.30:-0.06))/0.40,2));
        const band=sm((y+3.6)/1.6)*(1-sm((y-1.9)/1.7));   // no hard ends
        L *= 1-0.30*s*band;
      }
      const o=(j*px+i)*4;
      const n=(r()-0.5)*5;            // limewash tooth
      d[o]  =clamp((L+n)*WT.tint[0],0,255);
      d[o+1]=clamp((L+n)*WT.tint[1],0,255);
      d[o+2]=clamp((L+n)*WT.tint[2],0,255);
      d[o+3]=255;
    }
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
  t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;
  return t;
}

/* ---- cover surface: printed board under a satin varnish ---- */
const BOARD_FN = `
  // height field of a bound board: a shallow bulge that falls into a crisp chamfer
  float board(vec2 t){
    vec2 c=t*2.0-1.0;
    float bulge=(1.0-c.x*c.x)*(1.0-0.55*c.y*c.y);
    float e=clamp(min(min(t.x,1.0-t.x),min(t.y,1.0-t.y))/uER,0.0,1.0);
    float roll=sqrt(max(1.0-(1.0-e)*(1.0-e),0.0));   // quarter round, sharp at the lip
    return uBow*bulge*roll-uChamf*(1.0-roll);
  }`;
const COVER_VS = `
  uniform float uBow, uChamf, uER, uW, uH;
  varying vec2 vUv; varying vec3 vT, vB2, vNf; varying vec3 vWV;
  ${BOARD_FN}
  void main(){
    vUv=uv;
    vec3 pos=position; pos.z+=board(uv);
    mat3 M=mat3(modelMatrix);
    vT=normalize(M*vec3(1.0,0.0,0.0));
    vB2=normalize(M*vec3(0.0,1.0,0.0));
    vNf=normalize(M*vec3(0.0,0.0,1.0));
    vec4 wp=modelMatrix*vec4(pos,1.0);
    vWV=cameraPosition-wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp; }`;
const COVER_FS = `
  uniform sampler2D uTex; uniform float uSatin; uniform float uOpacity; uniform float uSeed;
  uniform float uBow, uChamf, uER, uW, uH;
  varying vec2 vUv; varying vec3 vT, vB2, vNf; varying vec3 vWV;
  ${BOARD_FN}
  float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
    p3+=dot(p3,p3.yxz+33.33); return fract((p3.x+p3.y)*p3.z); }
  float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
  void main(){
    vec2 uv=clamp(vUv,0.0008,0.9992);
    vec4 tex=texture2D(uTex,uv);

    // the board normal is evaluated per pixel, so the chamfer stays crisp
    // however coarse the mesh is
    float d=0.0016;
    float hx=(board(uv+vec2(d,0.0))-board(uv-vec2(d,0.0)))/(2.0*d*uW);
    float hy=(board(uv+vec2(0.0,d))-board(uv-vec2(0.0,d)))/(2.0*d*uH);

    // linen tooth, as a small extra slope
    vec2 q=uv*vec2(58.0,78.0)+uSeed;
    float tooth=vnoise(q)*0.6+vnoise(q*2.7)*0.4;
    vec2 g2=uv*9.0+uSeed;
    float n1=vnoise(g2), e=0.02;
    vec2 grain=vec2(vnoise(g2+vec2(e,0.0))-n1, vnoise(g2+vec2(0.0,e))-n1)/e;

    vec3 N=normalize(vNf
      - vT*(hx + (grain.x*0.0022+(tooth-0.5)*0.009)*uSatin)
      - vB2*(hy + (grain.y*0.0022+(tooth-0.5)*0.009)*uSatin));
    vec3 V=normalize(vWV);

    // one key from above and to the right, a broad fill bounced off the paper wall
    vec3 L=normalize(vec3(0.52,0.70,0.55));
    vec3 F=normalize(vec3(-0.35,-0.18,0.92));
    float key=max(dot(N,L),0.0);
    float fill=max(dot(N,F),0.0);
    float shade=0.70+0.34*key+0.14*fill;
    vec3 col=tex.rgb*shade;

    // a tight specular that only fires on the chamfer, plus a broad satin lobe
    vec3 Hv=normalize(L+V);
    float nh=max(dot(N,Hv),0.0);
    col+=vec3(pow(nh,110.0)*0.85*uSatin);
    col+=vec3(pow(nh,14.0)*0.045*uSatin);
    float fres=pow(1.0-max(dot(N,V),0.0),3.4);
    col+=vec3(fres*0.055*uSatin);
    col+=vec3((tooth-0.5)*0.010*uSatin);

    gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
    #include <colorspace_fragment>
  }`;
const SPINE_VS = `
  uniform float uHD;
  varying vec2 vUv; varying vec3 vNw, vTw, vBw, vWV; varying float vZ;
  void main(){
    vUv=uv;
    mat3 M=mat3(modelMatrix);
    vNw=normalize(M*normal);
    vTw=normalize(M*vec3(0.0,0.0,1.0));   // across the back
    vBw=normalize(M*vec3(0.0,1.0,0.0));   // head to tail
    vZ=position.z/uHD;
    vec4 wp=modelMatrix*vec4(position,1.0);
    vWV=cameraPosition-wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp; }`;
const SPINE_FS = `
  uniform sampler2D uTex; uniform float uOpacity; uniform float uSeed; uniform float uSatin;
  varying vec2 vUv; varying vec3 vNw, vTw, vBw, vWV; varying float vZ;
  float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
    p3+=dot(p3,p3.yxz+33.33); return fract((p3.x+p3.y)*p3.z); }
  float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
  void main(){
    vec4 tex=texture2D(uTex,clamp(vUv,0.0015,0.9985));
    float t=clamp(vZ,-1.0,1.0);
    // a hollow back: nearly flat down the middle, turning hard into the joints.
    // swept as an angle rather than a slope so the normal can reach the joints
    float ang=1.15*sign(t)*pow(abs(t),1.25);

    vec2 q=vUv*vec2(11.0,78.0)+uSeed;
    float tooth=vnoise(q)*0.6+vnoise(q*2.7)*0.4;
    vec3 N=normalize(vNw*cos(ang) + vTw*sin(ang)
                     + (vTw*0.009+vBw*0.009)*(tooth-0.5)*uSatin);
    vec3 V=normalize(vWV);

    vec3 L=normalize(vec3(0.52,0.70,0.55));
    vec3 F=normalize(vec3(-0.35,-0.18,0.92));
    float shade=0.70+0.34*max(dot(N,L),0.0)+0.14*max(dot(N,F),0.0);
    shade*=1.0-0.16*smoothstep(0.78,1.0,abs(t));      // the joint grooves
    vec3 col=tex.rgb*shade;

    // the key sits off to the right, so on the back it only ever grazes the
    // front joint — the bounce off the paper wall is what rakes the round
    vec3 Hv=normalize(L+V), Hf=normalize(F+V);
    float nh=max(dot(N,Hv),0.0), nf=max(dot(N,Hf),0.0);
    col+=vec3(pow(nh,110.0)*0.55*uSatin);
    col+=vec3(pow(nh,14.0)*0.045*uSatin);
    col+=vec3(pow(nf,46.0)*0.150*uSatin);
    col+=vec3(pow(nf,9.0)*0.032*uSatin);
    col+=vec3(pow(1.0-max(dot(N,V),0.0),3.4)*0.055*uSatin);
    col+=vec3((tooth-0.5)*0.010*uSatin);

    gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
    #include <colorspace_fragment>
  }`;
function spineMaterial(tex,seed){
  return new THREE.ShaderMaterial({transparent:true,
    uniforms:{uTex:{value:tex},uOpacity:{value:0},uSeed:{value:seed},
              uSatin:{value:1.0},uHD:{value:K.bookD*0.5}},
    vertexShader:SPINE_VS,fragmentShader:SPINE_FS});
}
function pagesMaterial(col){
  return new THREE.ShaderMaterial({
    transparent:true,
    uniforms:{uCol:{value:new THREE.Color(col)},uOpacity:{value:0},uH:{value:K.bookH*0.5}},
    vertexShader:`
      varying vec3 vP; varying vec3 vNw; varying vec3 vWV;
      void main(){ vP=position; vNw=normalize(mat3(modelMatrix)*normal);
        vec4 wp=modelMatrix*vec4(position,1.0);
        vWV=cameraPosition-wp.xyz;
        gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`
      uniform vec3 uCol; uniform float uOpacity; uniform float uH;
      varying vec3 vP; varying vec3 vNw; varying vec3 vWV;
      void main(){
        float f=vP.z*210.0;
        float w=fwidth(f);
        float line=0.5+0.5*cos(f*6.2831853);
        line=mix(0.5,line,clamp(1.0-w*1.6,0.0,1.0));
        vec3 col=uCol*0.88*mix(0.76,1.04,line);
        col*=1.0-0.16*smoothstep(0.25,1.0,abs(vP.y)/uH);
        col*=0.90+0.10*smoothstep(-0.09,0.09,vP.z);

        // the same rig as the boards, so the block turns with the volume
        vec3 N=normalize(vNw), V=normalize(vWV);
        vec3 L=normalize(vec3(0.52,0.70,0.55));
        vec3 F=normalize(vec3(-0.35,-0.18,0.92));
        float shade=0.70+0.34*max(dot(N,L),0.0)+0.14*max(dot(N,F),0.0);
        shade*=1.0-0.36*max(-N.y,0.0);      // the tail sits in its own shadow
        col*=shade/0.871;                   // 0.871 holds the fore-edge at its old tone
        // paper carries no real specular, only a graze
        col+=uCol*pow(1.0-max(dot(N,V),0.0),3.2)*max(dot(N,L),0.0)*0.11;
        gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
        #include <colorspace_fragment>
      }`});
}

/* ---- tweens ---- */
const easeOutQuart=t=>1-Math.pow(1-t,4);
const easeSettle  =t=>t<0.5? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const activeEase  =t=>t<0.3? 0.3*Math.pow(t/0.3,3) : 0.3+0.7*(1-Math.pow(1-(t-0.3)/0.7,3));
let NOW=0;
class Tw{
  constructor(v){this.v=v.slice();this.from=v.slice();this.to=v.slice();this.t0=0;this.d=0;this.e=easeOutQuart;}
  start(to,d,e,delay){this.from=this.v.slice();this.to=to.slice();this.t0=NOW+(delay||0);this.d=Math.max(d,1);this.e=e||easeOutQuart;}
  set(to){this.v=to.slice();this.from=to.slice();this.to=to.slice();this.d=0;}
  update(){ if(this.d<=0)return;
    let t=(NOW-this.t0)/this.d; if(t<0)return; if(t>=1){t=1;this.d=0;}
    const k=this.e(t); for(let i=0;i<this.v.length;i++)this.v[i]=this.from[i]+(this.to[i]-this.from[i])*k; }
}
class Spring{
  constructor(v,tension,friction,mass){this.v=v.slice();this.tgt=v.slice();this.vel=v.map(()=>0);
    this.k=tension;this.c=friction;this.m=mass||1;}
  start(t){this.tgt=t.slice();}
  update(dt){dt=Math.min(dt,1/30);
    for(let i=0;i<this.v.length;i++){
      const a=(this.k*(this.tgt[i]-this.v[i])-this.c*this.vel[i])/this.m;
      this.vel[i]+=a*dt;this.v[i]+=this.vel[i]*dt;}}
}

function buildBook(data,index){
  const rnd=mulberry(index*7919+13);
  const B={data,index,flipped:false};
  B._lean=K.lean+(rnd()-0.5)*0.075;
  B._yaw = K.yaw+(rnd()-0.5)*0.045;
  B._roll=(rnd()-0.5)*0.018;
  B.rest=[B._lean,B._yaw,B._roll];
  B.restTilt=MOBILE?K.mTilt:B._lean;
  B.base=[0,0,0.01];

  const gRoot=new THREE.Group(); gRoot.position.set(...B.basePos);
  const gHover=new THREE.Group(); gHover.position.set(...B.base);
  const gWob=new THREE.Group();
  const gTilt=new THREE.Group(); gTilt.rotation.set(...(MOBILE?[K.mTilt,0,0]:B.rest));
  const gScl=new THREE.Group(); gScl.scale.setScalar(0);
  gRoot.add(gHover); gHover.add(gWob); gWob.add(gTilt); gTilt.add(gScl);

  const coverTex=new THREE.CanvasTexture(paintCover(data,768,1152));
  coverTex.colorSpace=THREE.SRGBColorSpace; coverTex.anisotropy=8;
  const spineTex=new THREE.CanvasTexture(artSpine(data,142,1152));
  spineTex.colorSpace=THREE.SRGBColorSpace; spineTex.anisotropy=8;

  const pages=pagesMaterial(data.edge);

  const body=new THREE.Mesh(bodyGeo,[pages,spineMat,pages,pages,clothMat,clothMat]);

  const mk=(tex,satin,seed)=>new THREE.ShaderMaterial({transparent:true,

    vertexShader:`varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      uniform sampler2D uTex; uniform float uOpacity; varying vec2 vUv;
      float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
        p3+=dot(p3,p3.yxz+33.33);return fract((p3.x+p3.y)*p3.z);}
      void main(){

  refl=new THREE.Mesh(new THREE.PlaneGeometry(SZW,0.60),reflMat);

function hoverOut(B){

  B.tRefl.start([0.34],d,easeSettle);

function activeZ(){
  const camZ=camera.position.z;
  const fill=MOBILE?0.86:0.60;
  const halfH=(SZH*0.5)/fill;
  const dv=halfH/Math.tan(K.fov*Math.PI/360);
  const halfW=(SZW*0.5)/fill;
  const dh=halfW/(Math.tan(K.fov*Math.PI/360)*camera.aspect);
  return camZ-Math.max(dv,dh);
}
function toActive(B){
  S.anim='animatingForward'; hoverIn(B);
  B.tSeat.start([0],K.activeDuration*0.55,easeSettle,K.activeDuration*0.12);
  const isNarrow = VW < 768;
  const ay = isNarrow ? (K.boxCY + 0.32) : (K.boxCY - 0.02);
  const ax = isNarrow ? 0 : K.activeX;
  B.tActiveP.start([ax,ay,activeZ()],K.activeDuration,activeEase);
  B.tActiveR.start([...K.activeRot],K.activeDuration,activeEase);
  B.gRoot.renderOrder=10; setLayer(B,LAY_FG);
  setTimeout(()=>{ if(S.active===B) S.anim='active'; },K.activeDuration);
}
function toInactive(B){
  S.anim='animatingBackward'; B.flipped=false;
  B.tSeat.start([1],K.activeDuration*0.62,easeSettle,K.activeDuration*0.38);
  B.tHover.start([B.base[0],B.base[1]+0.06,B.base[2]],K.activeDuration,easeOutQuart);
  B.tActiveP.start([...B.basePos],K.activeDuration,activeEase);
  B.tActiveR.start([...K.activeRot],K.activeDuration,activeEase);
  setTimeout(()=>hoverOut(B),K.activeDuration);
  setTimeout(()=>{ S.anim='inactive'; setLayer(B,LAY_BG);
                   B.gRoot.renderOrder=MOBILE?100-B.index:0;
                   if(S.lifted===B)S.lifted=null; },K.activeDuration+20);
}
function setLayer(B,l){ B.gRoot.traverse(o=>o.layers.set(l)); }
function setActive(B){
  if(S.anim==='intro') S.anim='inactive';

/* ════════════════════════════════════════════════════════════════════════
   5 · CAMERA (orbits toward the pointer) + BLUR COMPOSITE
   ════════════════════════════════════════════════════════════════════════ */
let VW=1,VH=1,DIST=12;
const ORB={tx:0,ty:0,x:0,y:0};
const TGT=new THREE.Vector3();
function mobileTargetY(){
  const tan=Math.tan(K.fov*Math.PI/360);
  const D=DIST-K.mZ0;
  const stackTop=K.mY+(BOOKS.length-1)*K.mStepY+SZH*0.5*Math.cos(K.mTilt);
  return Math.max(K.mY+K.mDrop*D*tan, stackTop-0.80*D*tan);
}
function applyCamera(){
  const damp=MOBILE?0:(S.active?0.42:1);
  const az=ORB.x*K.orbitAz*damp;
  const el=0.0025-ORB.y*K.orbitEl*damp;
  TGT.set(0, MOBILE?mobileTargetY():K.boxCY, 0);
  camera.position.set(
    TGT.x+Math.sin(az)*Math.cos(el)*DIST,
    TGT.y+Math.sin(el)*DIST,
    TGT.z+Math.cos(az)*Math.cos(el)*DIST);
  camera.lookAt(TGT);
}
function frameCamera(){
  const aspect=VW/VH, tan=Math.tan(K.fov*Math.PI/360);
  camera.aspect=aspect;
  if(MOBILE){
    const a=clamp(aspect,0.40,0.95);
    DIST=(SZW*0.5)/(K.mFill*tan*a)+K.mZ0;
    camera.near=Math.max(DIST-9,0.1); camera.far=DIST+26;
  } else {
    const distV=K.boxY/(2*tan), distH=K.boxX/(2*tan*aspect);
    let d=K.offset*Math.max(distV,distH);
    if(aspect < 1.0) d *= 1.08;
    const projW=VW*K.boxX/(2*d*tan*aspect);
    if(projW>K.maxWidthPx) d=VW*K.boxX/(2*K.maxWidthPx*tan*aspect);
    DIST=d;
    const maxDim=Math.max(K.boxX,K.boxY);
    camera.near=Math.max(DIST-maxDim*2-2,0.1); camera.far=DIST+maxDim*2+16;
  }
  applyCamera();
  camera.updateProjectionMatrix();
}

const rt=new THREE.WebGLRenderTarget(2,2,{
  type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,
  depthBuffer:true,stencilBuffer:false,samples:4});
const NOISE_N=256, noiseData=new Uint8Array(NOISE_N*NOISE_N*4);
{ const r=mulberry(4242);
  for(let i=0;i<NOISE_N*NOISE_N;i++){noiseData[i*4]=(r()*255)|0;noiseData[i*4+1]=(r()*255)|0;
    noiseData[i*4+2]=(r()*255)|0;noiseData[i*4+3]=255;} }
const noiseTex=new THREE.DataTexture(noiseData,NOISE_N,NOISE_N);
noiseTex.wrapS=noiseTex.wrapT=THREE.RepeatWrapping;
noiseTex.minFilter=noiseTex.magFilter=THREE.LinearFilter;noiseTex.needsUpdate=true;

const passMat=new THREE.ShaderMaterial({
  depthTest:false,depthWrite:false,
  uniforms:{backgroundTexture:{value:rt.texture},noiseTexture:{value:noiseTex},
    noiseScale:{value:6},intensity:{value:0},ignoreBlur:{value:true},
    samples:{value:30},resolution:{value:new THREE.Vector2(1,1)}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,
  fragmentShader:`
    uniform sampler2D backgroundTexture; uniform sampler2D noiseTexture;
    uniform float noiseScale; uniform float intensity; uniform bool ignoreBlur;
    uniform float samples; uniform vec2 resolution;
    varying vec2 vUv;
    const float pi=3.14159265359;
    const float goldenAngle=pi*(3.0-sqrt(5.0));
    vec4 goldenBlur(vec2 uv,sampler2D tex){
      float noise=texture2D(noiseTexture,uv*noiseScale).r;
      float angle=pi+(noise-0.5)*2.0*pi*2.0;
      vec2 polar=vec2(cos(angle),sin(angle));
      vec4 sum=vec4(0.0);
      vec2 a=vec2(1024.)*vec2(1.,resolution.x/resolution.y);
      for(int i=1;i<=32;i++){
        if(float(i)>samples)break;
        float r=intensity*sqrt(float(i)/samples);
        float theta=float(i)*goldenAngle;
        vec2 off=vec2(polar.x*cos(theta)-polar.y*sin(theta),
                      polar.y*cos(theta)+polar.x*sin(theta));
        sum+=texture2D(tex,uv+(off*r/a));
      }
      return sum/samples;
    }
    void main(){
      gl_FragColor=texture2D(backgroundTexture,vUv);
      if(!ignoreBlur) gl_FragColor=goldenBlur(vUv,backgroundTexture);
      gl_FragColor.a=1.0;
      #include <colorspace_fragment>
    }`});
const quadGeo=new THREE.BufferGeometry();
quadGeo.setAttribute('position',new THREE.Float32BufferAttribute([-1,-1,0,3,-1,0,-1,3,0],3));
quadGeo.setAttribute('uv',new THREE.Float32BufferAttribute([0,0,2,0,0,2],2));
const quad=new THREE.Mesh(quadGeo,passMat); quad.frustumCulled=false;

   6 · UI

const dMeta=document.getElementById('detail-meta'), dTitle=document.getElementById('detail-title');

/* ---- a torn sheet that slides in from the left to carry the copy ---- */
const washEl=document.getElementById('wash');
const wctx=washEl.getContext('2d');
const WASH={t:0,target:0,w:1,h:1,sheet:null,travel:1,dirty:true};

function hash1(i){ let x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function vnoise1(t,seed){
  const i=Math.floor(t), f=t-i, u=f*f*(3-2*f);
  return lerp(hash1(i+seed*97.3), hash1(i+1+seed*97.3), u);
}
function hash2(x,y){ let v=Math.sin(x*12.9898+y*78.233)*43758.5453; return v-Math.floor(v); }

/* the torn band: solid on the left, breaking into fibres on the right */
function buildTearBand(TW,h){
  const oct=[[1/430,44],[1/170,21],[1/74,10.5],[1/31,5.0],[1/13,2.4],[1/6,1.2]];
  const edge=new Float32Array(h);
  for(let y=0;y<h;y++){
    let e=TW*0.42;
    for(let k=0;k<oct.length;k++) e+=(vnoise1(y*oct[k][0],k+1)-0.5)*2*oct[k][1];
    edge[y]=e;
  }
  const a=new Float32Array(TW*h);
  for(let y=0;y<h;y++){
    const e=edge[y];
    const fib=5+17*vnoise1(y/8.5,11);          // fibre length varies down the tear
    for(let x=0;x<TW;x++){
      const t=(x-e)/fib;
      let v;
      if(t<=0) v=1;
      else if(t>=1.35) v=0;
      else {
        // break the falloff up so it reads as fibres rather than a soft cut
        const n=hash2(Math.floor(x*0.9),Math.floor(y*0.75))*0.62
               +hash2(Math.floor(x*2.4)+37,Math.floor(y*2.1)+11)*0.38;
        v=clamp(1.18-t-(n-0.5)*0.95,0,1);
        v=v*v*(3-2*v);
      }
      a[y*TW+x]=v;
    }
  }
  return a;
}
function tintBand(a,TW,h,r,g0,b0,edgeDark){
  const c=C(TW,h), g=c.getContext('2d');
  const img=g.createImageData(TW,h), d=img.data;
  for(let i=0;i<TW*h;i++){
    const v=a[i];
    let k=1;
    if(edgeDark&&v>0.02&&v<0.97) k=0.86+0.14*v;   // compressed fibres at the tear
    d[i*4]=r*k; d[i*4+1]=g0*k; d[i*4+2]=b0*k;
    d[i*4+3]=v*255;
  }
  g.putImageData(img,0,0);
  return c;
}
function buildSheet(){
  const w=WASH.w,h=WASH.h;
  if(w<8||h<8) return;
  const TW=Math.min(210,Math.round(w*0.34));
  const X0=Math.max(0,w-TW-46);
  const a=buildTearBand(TW,h);
  const paper=tintBand(a,TW,h,219,202,175,true);
  const dark =tintBand(a,TW,h,86,68,46,false);
  const cv=C(w,h), g=cv.getContext('2d');
  // the sheet casts a soft shadow onto the scene behind it
  const BL=40;                       // the sheet bleeds past the left edge of the canvas
  g.save(); g.globalAlpha=0.34; g.filter=`blur(${Math.round(h*0.020)}px)`;
  g.fillStyle='#56432e'; g.fillRect(-BL,0,X0+16+BL,h);
  g.drawImage(dark,X0+16,0);
  g.restore();
  // the sheet itself
  const pg=g.createLinearGradient(0,0,w,0);
  pg.addColorStop(0,'rgb(222,206,180)');
  pg.addColorStop(0.72,'rgb(219,202,175)');
  pg.addColorStop(1,'rgb(213,195,167)');
  g.fillStyle=pg; g.fillRect(-BL,0,X0+1+BL,h);
  g.drawImage(paper,X0,0);
  // fibre grain, only where there is paper
  g.globalCompositeOperation='source-atop';
  const r=mulberry(913);
  for(let i=0;i<2600;i++){
    const x=r()*w, y=r()*h, l=2+r()*26, ang=(r()-0.5)*0.5;
    g.strokeStyle=r()<0.5?`rgba(255,250,240,${0.02+r()*0.05})`:`rgba(120,98,70,${0.02+r()*0.05})`;
    g.lineWidth=r()<0.85?1:2;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(ang)*l,y+Math.sin(ang)*l); g.stroke();
  }
  g.fillStyle='rgba(255,252,244,0.05)';
  g.fillRect(-BL,0,w+BL,h*0.5);
  g.globalCompositeOperation='source-over';
  WASH.sheet=cv; WASH.travel=X0+TW+60;
}
function washResize(){
  const w=Math.max(1,washEl.clientWidth), h=Math.max(1,washEl.clientHeight);
  washEl.width=w; washEl.height=h; WASH.w=w; WASH.h=h;
  buildSheet(); WASH.dirty=true;
}
function drawWash(){
  const w=WASH.w,h=WASH.h,t=WASH.t;
  wctx.clearRect(0,0,w,h);
  if(t<=0.002||!WASH.sheet) return;
  wctx.drawImage(WASH.sheet,-(1-t)*WASH.travel,0);
}

const ray=new THREE.Raycaster();
ray.layers.enable(LAY_BG); ray.layers.enable(LAY_FG);
const ptr=new THREE.Vector2();
const DRAG={on:false,moved:0,lx:0,ly:0,rx:0,ry:0};
function dragReset(){DRAG.on=false;DRAG.moved=0;DRAG.rx=0;DRAG.ry=0;}
addEventListener('pointermove',e=>{
  ORB.tx=(e.clientX/VW-0.5)*2; ORB.ty=(e.clientY/VH-0.5)*2;
  hintEl.style.transform=`translate(${e.clientX+12}px,${e.clientY+12}px)`;
  if(S.anim==='intro'||MOBILE)return;
  ptr.x=(e.clientX/VW)*2-1; ptr.y=-(e.clientY/VH)*2+1;
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(books.map(b=>b.hit),false);
  const B=hits.length?hits[0].object.userData.book:null;
  if(S.active){
    if(DRAG.on){                                   // turning the volume in the hand
      const dx=e.clientX-DRAG.lx, dy=e.clientY-DRAG.ly;
      DRAG.lx=e.clientX; DRAG.ly=e.clientY;
      DRAG.moved+=Math.abs(dx)+Math.abs(dy);
      DRAG.ry+=dx*0.0090;
      DRAG.rx=clamp(DRAG.rx+dy*0.0062,-0.62,0.62);
      S.active.sWob.start([DRAG.rx,DRAG.ry,0]);
      document.body.style.cursor='grabbing';
      return;
    }
    if(B===S.active&&S.anim==='active'){
      if(!REDUCED&&hits[0].uv){                    // a light parallax when the hand is off
        const uv=hits[0].uv;
        S.active.sWob.start([DRAG.rx+Math.PI/46*(uv.y-.5)*2*(S.active.flipped?-1:1),
                             DRAG.ry+Math.PI/36*((S.active.flipped?1-uv.x:uv.x)-.5)*2,0]);
      }
      hintEl.classList.add('on'); document.body.style.cursor='grab';
    } else { hintEl.classList.remove('on'); document.body.style.cursor='default';
             S.active.sWob.start([DRAG.rx,DRAG.ry,0]); }
    return;
  }
  if(S.anim!=='inactive')return;
  setLifted(B);
  document.body.style.cursor=B?'pointer':'default';
  if(B&&hits[0].uv&&!REDUCED){
    const uv=hits[0].uv;
    B.sWob.start([Math.PI/50*(uv.y-.5)*2, Math.PI/40*(uv.x-.5)*2, 0]);
  }
});
addEventListener('pointerleave',()=>{ ORB.tx=0;ORB.ty=0;

addEventListener('blur',()=>{ ORB.tx=0;ORB.ty=0; });
addEventListener('pointerdown',e=>{

   THE WEDDING LOOKBOOK ENGINE (Interactive Magazine Reader)
   ════════════════════════════════════════════════════════════════════════ */
const LOOKBOOK_PAGES = [
  { file: 'spread-00.webp', title: 'Prologue: Celebrating Love Stories', place: 'Mivi Events · Kerala' },
  { file: 'spread-01.webp', title: 'Shasbeel & N: The Crimson Veil', place: 'Thrissur Grand Palace' },
  { file: 'spread-02.webp', title: 'Shasbeel & N: Laughter & Forever Blooms', place: 'Pavaratty · Kerala' },
  { file: 'spread-03.webp', title: 'Mangalyam: Golden Mandap & Sacred Vilakku', place: 'Guruvayoor · Thrissur' },
  { file: 'spread-04.webp', title: 'Mangalyam: Kasavu Nuptials & Lotus Garlands', place: 'Sacred Heritage' },
  { file: 'spread-05.webp', title: 'Mangalyam: Namaskaram & Family Gathering', place: 'Traditional Mandap' },
  { file: 'spread-06.webp', title: 'Nivin & Ancy: Coastal Starlight Pavilion', place: 'Kochi Beachfront Gala' },
  { file: 'spread-07.webp', title: 'Nivin & Ancy: Midnight Reception Gala', place: 'Twilight Ballroom' }
];
LOOKBOOK_PAGES.forEach(p => p.url = 'lookbook/' + p.file);
const LM = LOOKBOOK_PAGES.length;

const sb3d = document.getElementById('sb3d');
const sbBook = document.getElementById('sbBook');
const sbCapBox = document.getElementById('sbCaptions');
const sbHint = document.getElementById('sbHint');
const sbStage = document.getElementById('sbStage');

const STRIP_N = 18;
const SPAN = 0.449;
const BETA = 0.60;
let bookIdx = 0, bookTurn = null;
let bookStrips = [];

function bEl(t, c) { const e = document.createElement(t); if (c) e.className = c; return e; }

function bImgEl(i, side) {
  const im = new Image(); im.className = 'sb-half-img ' + side;
  im.draggable = false; im.alt = LOOKBOOK_PAGES[i].title; im.src = LOOKBOOK_PAGES[i].url; return im;
}

function bHalfEl(pos, i) {
  const d = bEl('div', 'sb-half ' + pos);
  d.appendChild(bImgEl(i, pos));
  d.appendChild(bEl('div', 'gutter-shade ' + pos));
  return d;
}

function buildCurl(dir, from, to) {
  bookStrips = [];
  const c = bEl('div', 'curl ' + dir);
  c.style.setProperty('--n', STRIP_N);
  c.style.setProperty('--span', SPAN);
  let host = c;
  for (let i = 0; i < STRIP_N; i++) {
    const s = bEl('div', 'strip');
    s.style.setProperty('--i', i);
    const gut = 'calc(var(--bw) * 0.5)';
    const sw = 'calc(var(--bw) * ' + SPAN + ' / ' + STRIP_N + ')';
    const A = 'calc(-1 * (' + gut + ' + ' + i + ' * ' + sw + '))';
    const B = 'calc(' + (i + 1) + ' * ' + sw + ' - ' + gut + ')';
    const f = bEl('div', 'face front'), b = bEl('div', 'face back');
    const dress = (e, url, px) => {
      e.style.backgroundImage = 'url(' + url + ')';
      e.style.backgroundPositionX = px;
    };
    dress(f, LOOKBOOK_PAGES[from].url, dir === 'next' ? A : B);
    dress(b, LOOKBOOK_PAGES[to].url, dir === 'next' ? B : A);
    f.appendChild(bEl('div', 'sh')); f.appendChild(bEl('div', 'gl'));
    b.appendChild(bEl('div', 'sh')); b.appendChild(bEl('div', 'gl'));
    s.appendChild(f); s.appendChild(b);
    if (i === STRIP_N - 1) s.classList.add('edge');
    host.appendChild(s); host = s;
    bookStrips.push(s);
  }
  return c;
}

function applyBookTurn(t) {
  if (!sb3d) return;
  const th = Math.PI * t;
  const beta = BETA * Math.sin(Math.PI * t);
  const D = 180 / Math.PI;
  const tt = th + beta, td = 2 * beta / STRIP_N;
  sb3d.style.setProperty('--tt', (tt * D).toFixed(2) + 'deg');
  sb3d.style.setProperty('--td', (td * D).toFixed(3) + 'deg');
  sb3d.style.setProperty('--shade', Math.sin(Math.PI * t).toFixed(3));
  fadeBookCaption(t);
  for (let i = 0; i < bookStrips.length; i++) {
    const l1 = Math.abs(Math.cos(tt - i * td));
    const l2 = Math.abs(Math.cos(tt - (i + 1) * td));
    const st = bookStrips[i].style;
    st.setProperty('--lit', l1.toFixed(3));
    st.setProperty('--a1', ((1 - l1) * 0.62).toFixed(3));
    st.setProperty('--a2', ((1 - l2) * 0.62).toFixed(3));
  }
}

function paintBook() {
  if (!sbBook) return;
  sbBook.textContent = '';
  if (!bookTurn) {
    const f = bEl('div', 'sb-full');
    const im = new Image(); im.src = LOOKBOOK_PAGES[bookIdx].url; im.alt = LOOKBOOK_PAGES[bookIdx].title;
    im.draggable = false;
    f.appendChild(im); sbBook.appendChild(f);
    if (sb3d) sb3d.style.setProperty('--shade', '0');
  } else {
    const next = bookTurn.dir === 'next';
    sbBook.appendChild(bHalfEl('left', next ? bookTurn.from : bookTurn.to));
    sbBook.appendChild(bHalfEl('right', next ? bookTurn.to : bookTurn.from));
    sbBook.appendChild(buildCurl(bookTurn.dir, bookTurn.from, bookTurn.to));
    applyBookTurn(bookTurn.t);
  }
  const a = bEl('button', 'sb-zone sb-prev'), b = bEl('button', 'sb-zone sb-next');
  a.setAttribute('aria-label', 'previous spread');
  b.setAttribute('aria-label', 'next spread');
  sbBook.appendChild(a); sbBook.appendChild(b);
  layoutBook();
  captionBook();
  syncZoomLayer();
  placeLoupe();
}

let bCapOut = null, bCapIn = null;
function captionBook() {
  if (!sbCapBox) return;
  sbCapBox.textContent = '';
  bCapOut = bCapIn = null;
  if (bookTurn) {
    bCapOut = bEl('p', 'sb-caption live'); bCapOut.textContent = LOOKBOOK_PAGES[bookTurn.from].title; sbCapBox.appendChild(bCapOut);
    bCapIn = bEl('p', 'sb-caption live'); bCapIn.textContent = LOOKBOOK_PAGES[bookTurn.to].title; sbCapBox.appendChild(bCapIn);
    fadeBookCaption(bookTurn.t);
  } else {
    const p = bEl('p', 'sb-caption'); p.textContent = LOOKBOOK_PAGES[bookIdx].title; sbCapBox.appendChild(p);
  }
}

function fadeBookCaption(t) {
  if (!bCapOut || !bCapIn) return;
  const out = 1 - Math.max(0, Math.min(1, (t - 0.10) / 0.28));
  const inn = Math.max(0, Math.min(1, (t - 0.56) / 0.30));
  bCapOut.style.opacity = out.toFixed(3);
  bCapIn.style.opacity = inn.toFixed(3);
}

function layoutBook() {
  if (sb3d && sbBook) {
    sb3d.style.setProperty('--bw', sbBook.clientWidth + 'px');
  }
}
window.addEventListener('resize', layoutBook);

// Spring engine for turning pages
let bSpring = null, bRaf = null, bLast = 0;
function animateBookTo(target, onDone, stiff, damp) {
  bSpring = { kind: 'spring', v: 0, target: target, done: onDone, k: stiff || 150, c: damp || 22 };
  kickBook();
}

function tickBook(now) {
  bRaf = null;
  const dt = Math.min(0.032, (now - bLast) / 1000 || 0.016); bLast = now;
  if (bSpring && bookTurn) {
    const s = bSpring;
    const x = bookTurn.t - s.target;
    s.v += (-s.k * x - s.c * s.v) * dt;
    bookTurn.t += s.v * dt;
    if (Math.abs(bookTurn.t - s.target) < 0.002 && Math.abs(s.v) < 0.02) {
      bookTurn.t = s.target; bSpring = null;
      applyBookTurn(bookTurn.t);
      const d = s.done; d && d();
    } else applyBookTurn(bookTurn.t);
  }
  viewSpringBook();
  const lmoved = loupeEase();
  if ((bSpring || bViewActive || lmoved) && bRaf === null) bRaf = requestAnimationFrame(tickBook);
}
function kickBook() { if (bRaf === null) { bLast = performance.now(); bRaf = requestAnimationFrame(tickBook); } }

// 3D Tilt of the Book
const bView = { rx: 0, ry: 0, z: 1, trx: 0, try_: 0, tz: 1 };
let bViewActive = false, lastBZ = 1;

function applyViewBook() {
  if (!sb3d) return;
  sb3d.style.setProperty('--rx', bView.rx.toFixed(2) + 'deg');
  sb3d.style.setProperty('--ry', bView.ry.toFixed(2) + 'deg');
  sb3d.style.setProperty('--zoom', bView.z.toFixed(3));
  if (bView.z !== lastBZ) { lastBZ = bView.z; placeLoupe(); }
}

function viewSpringBook() {
  const e = 0.14;
  let moved = false;
  for (const [k, t] of [['rx', 'trx'], ['ry', 'try_'], ['z', 'tz']]) {
    const d = bView[t] - bView[k];
    if (Math.abs(d) > 0.0006) { bView[k] += d * e; moved = true; }
    else bView[k] = bView[t];
  }
  if (moved) applyViewBook();
  bViewActive = moved;
  return moved;
}

function setViewBook(rx, ry, z) {
  bView.trx = Math.max(-4.5, Math.min(4.5, rx));
  bView.try_ = Math.max(-7, Math.min(7, ry));
  bView.tz = Math.max(0.9, Math.min(1.5, z));
  bViewActive = true; kickBook();
  syncZoom();
}

if (sbStage) {
  sbStage.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' || bDrag) return;
    const r = sbBook.getBoundingClientRect();
    if (!r.width) return;
    const nx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (r.width * 0.62)));
    const ny = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (r.height * 0.9)));
    setViewBook(-ny * 4.5, nx * 7, bView.tz);
  }, { passive: true });

  // Book Drag & Turn
  let bDrag = null;
  sbStage.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const onBook = e.target.closest('.sb-zone');
    if (!onBook) return;
    e.preventDefault();
    sbStage.setPointerCapture(e.pointerId);
    if (sbHint) sbHint.classList.add('gone');
    const r = sbBook.getBoundingClientRect();
    const dir = (e.clientX - r.left) / r.width > 0.5 ? 'next' : 'prev';
    startBookTurn(dir, 0);
    bDrag = { dir: dir, x0: e.clientX, w: r.width, moved: 0, vel: 0, tPrev: performance.now() };
  });

  sbStage.addEventListener('pointermove', e => {
    if (!bDrag) return;
    const dx = e.clientX - bDrag.x0;
    bDrag.moved = Math.max(bDrag.moved, Math.abs(dx));
    const raw = (bDrag.dir === 'next' ? -dx : dx) / (bDrag.w * 0.62);
    const t = Math.max(0, Math.min(1, raw));
    const now = performance.now();
    bDrag.vel = (t - (bookTurn ? bookTurn.t : 0)) / Math.max(0.001, (now - bDrag.tPrev) / 1000);
    bDrag.tPrev = now;
    if (bookTurn) { bookTurn.t = t; applyBookTurn(t); }
  });

  function endBookDrag() {
    if (!bDrag) return;
    const d = bDrag; bDrag = null;
    if (!bookTurn) return;
    if (d.moved < 6) { commitBookTurn(); return; }
    const go = bookTurn.t > 0.42 || d.vel > 1.1;
    if (go) commitBookTurn(); else cancelBookTurn();
  }
  sbStage.addEventListener('pointerup', endBookDrag);
  sbStage.addEventListener('pointercancel', endBookDrag);
}

function startBookTurn(dir, t) {
  bSpring = null;
  if (bookTurn) { bookIdx = bookTurn.to; bookTurn = null; }
  shoveLoupe(dir);
  const from = bookIdx;
  bookTurn = { dir: dir, from: from, to: dir === 'next' ? (from + 1) % LM : (from - 1 + LM) % LM, t: t || 0 };
  paintBook();
}
function commitBookTurn() {
  if (!bookTurn) return;
  animateBookTo(1, () => { bookIdx = bookTurn.to; bookTurn = null; paintBook(); }, 170, 26);
}
function cancelBookTurn() {
  if (!bookTurn) return;
  animateBookTo(0, () => { bookTurn = null; paintBook(); }, 170, 26);
}
function turnBook(dir) {
  if (bookTurn) return;
  startBookTurn(dir, 0.02);
  animateBookTo(1, () => { bookIdx = bookTurn.to; bookTurn = null; paintBook(); }, 160, 24);
}

const sbLeft = document.getElementById('sbLeft');
const sbRight = document.getElementById('sbRight');
if (sbLeft) sbLeft.addEventListener('click', () => turnBook('prev'));
if (sbRight) sbRight.addEventListener('click', () => turnBook('next'));

// Brass Magnifier Loupe
const loupe = document.getElementById('loupe');
const loupeLens = document.getElementById('loupeLens');
const loupeBtn = document.getElementById('loupeBtn');
let loupeEnabled = true;
const loupePos = { x: 0, y: 0, tx: 0, ty: 0, held: false, moved: false };

function restLoupe() {
  if (!sbBook) return;
  const bw = sbBook.clientWidth || 700;
  loupePos.tx = bw * 0.46; loupePos.ty = bw * 0.38;
  loupePos.x = loupePos.tx; loupePos.y = loupePos.ty;
  placeLoupe();
}
function shoveLoupe(dir) {
  if (!sbBook) return;
  const bw = sbBook.clientWidth;
  loupePos.tx = dir === 'next' ? bw * 0.16 : bw * 0.72;
  loupePos.ty = bw * 0.40;
  kickBook();
}
function loupeEase() {
  if (loupePos.held) return false;
  const e = 0.16;
  const dx = loupePos.tx - loupePos.x, dy = loupePos.ty - loupePos.y;
  if (Math.abs(dx) > 0.4 || Math.abs(dy) > 0.4) {
    loupePos.x += dx * e; loupePos.y += dy * e;
    placeLoupe(); return true;
  }
  return false;
}
function placeLoupe() {
  if (!loupe || !sbBook) return;
  const bw = sbBook.clientWidth; if (!bw) return;
  const lr = Math.max(160, Math.min(270, bw * 0.32));
  loupe.style.setProperty('--lr', lr.toFixed(1) + 'px');
  loupe.style.transform = 'translate(' + (loupePos.x - lr / 2).toFixed(1) + 'px,' + (loupePos.y - lr / 2).toFixed(1) + 'px)';
  if (loupeLens) {
    const magScale = 2.4;
    loupeLens.style.backgroundImage = 'url(' + LOOKBOOK_PAGES[bookIdx].url + ')';
    loupeLens.style.backgroundSize = (bw * magScale).toFixed(1) + 'px auto';
    loupeLens.style.backgroundPosition = (-loupePos.x * magScale + lr / 2).toFixed(1) + 'px ' + (-loupePos.y * magScale + lr / 2).toFixed(1) + 'px';
  }
}

if (loupe) {
  loupe.classList.add('on');
  let lDrag = null;
  loupe.addEventListener('pointerdown', e => {
    if (!loupeEnabled || e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    loupe.setPointerCapture(e.pointerId);
    loupe.classList.add('held');
    loupePos.held = true;
    const r = sbBook.getBoundingClientRect();
    lDrag = { x0: e.clientX, y0: e.clientY, lx: loupePos.x, ly: loupePos.y, r: r };
  });
  loupe.addEventListener('pointermove', e => {
    if (!lDrag) return;
    const dx = e.clientX - lDrag.x0, dy = e.clientY - lDrag.y0;
    loupePos.x = Math.max(30, Math.min(lDrag.r.width - 30, lDrag.lx + dx));
    loupePos.y = Math.max(30, Math.min(lDrag.r.height - 30, lDrag.ly + dy));
    loupePos.tx = loupePos.x; loupePos.ty = loupePos.y;
    placeLoupe();
  });
  const endLDrag = e => {
    if (!lDrag) return;
    loupe.classList.remove('held');
    loupePos.held = false; lDrag = null;
  };
  loupe.addEventListener('pointerup', endLDrag);
  loupe.addEventListener('pointercancel', endLDrag);
}

if (loupeBtn) {
  loupeBtn.addEventListener('click', () => {
    loupeEnabled = !loupeEnabled;
    loupeBtn.setAttribute('aria-pressed', loupeEnabled ? 'true' : 'false');
    if (loupe) loupe.classList.toggle('on', loupeEnabled);
  });
}

// Zoom Layer & Tools
const zOut = document.getElementById('zOut'), zIn = document.getElementById('zIn'), zRead = document.getElementById('zRead');
const zoomWrap = document.getElementById('zoomWrap'), zoomInner = document.getElementById('zoomInner');
function syncZoom() {
  if (zRead) zRead.textContent = Math.round(bView.tz * 100) + '%';
  if (zOut) zOut.disabled = bView.tz <= 0.95;
  if (zIn) zIn.disabled = bView.tz >= 1.45;
}
function setZoom(dz) { setViewBook(bView.trx, bView.try_, bView.tz + dz); }
if (zOut) zOut.addEventListener('click', () => setZoom(-0.2));
if (zIn) zIn.addEventListener('click', () => setZoom(0.2));

function syncZoomLayer() {
  if (!zoomInner) return;
  zoomInner.textContent = '';
  const im = new Image(); im.src = LOOKBOOK_PAGES[bookIdx].url; im.alt = '';
  zoomInner.appendChild(im);
}

// Modal open/close controllers
function openLookbookModal(B) {
  const bData = B ? B.data : BOOKS[0];
  const modal = document.getElementById('lookbook-modal');
  if (!modal) return;
  
  modal.classList.add('on');
  modal.setAttribute('aria-hidden', 'false');
  document.body.classList.add('lb-open');
  
  const volTag = document.getElementById('lbVolTag');
  if (volTag && bData) {
    volTag.textContent = `Volume ${bData.vol} • ${bData.title} (${bData.year})`;
  }
  
  const targetSpread = (bData && typeof bData.spreadIdx === 'number') ? bData.spreadIdx : 0;
  bookIdx = targetSpread;
  bookTurn = null;
  
  setTimeout(() => {
    paintBook();
    applyViewBook();
    restLoupe();
    layoutBook();
  }, 40);
}

function closeLookbookModal() {
  const modal = document.getElementById('lookbook-modal');
  if (!modal) return;
  modal.classList.remove('on');
  modal.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('lb-open');
}

const lbCloseBtn = document.getElementById('lbCloseBtn');
if (lbCloseBtn) lbCloseBtn.addEventListener('click', e => { e.stopPropagation(); closeLookbookModal(); });

const lbCloseBackdrop = document.getElementById('lbCloseBackdrop');
if (lbCloseBackdrop) lbCloseBackdrop.addEventListener('click', e => { e.stopPropagation(); closeLookbookModal(); });

const lbFullscreenBtn = document.getElementById('lbFullscreenBtn');
if (lbFullscreenBtn) {
  lbFullscreenBtn.addEventListener('click', e => {
    e.stopPropagation();
    closeLookbookModal();
    if (window.parent && window.parent !== window) {
      try {
        const el = window.parent.document.getElementById('lookbook-section');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch(err) {
        window.parent.postMessage({ action: 'scrollToLookbook' }, '*');
      }
    }
  });
}


let last=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  NOW=now; const dt=Math.min((now-last)/1000,0.05); last=now;

  // during the intro the camera snaps to the pointer instead of easing, so the
  // shelf never swings into place on load
  {
    const tg=WASH.target, k2=Math.min(1,dt*(tg>WASH.t?5.2:8.5));
    if(Math.abs(tg-WASH.t)>0.0009||WASH.dirty){ WASH.t+=(tg-WASH.t)*k2; WASH.dirty=false; drawWash(); }
  }
  const k=(S.anim==='intro')?1:Math.min(1,dt*3.4);
  ORB.x+=(ORB.tx-ORB.x)*k; ORB.y+=(ORB.ty-ORB.y)*k;
  applyCamera();

  wallFade.update();
  const wf=wallFade.v[0];
  wallMat.uniforms.uOpacity.value=wf; oakH.uniforms.uOpacity.value=wf; oakV.uniforms.uOpacity.value=wf;

  if(MOBILE){
    if(!S.active) M.scroll+=(M.target-M.scroll)*Math.min(1,dt*9);
    setMobileIndex(Math.round(M.scroll));
    for(const B of books){
      B.basePos=mPos(B.index,M.scroll);
      if(B===S.active||S.anim==='animatingBackward')continue;
      B.tActiveP.v[0]=B.basePos[0];B.tActiveP.v[1]=B.basePos[1];B.tActiveP.v[2]=B.basePos[2];
      B.tActiveP.d=0;
      const u=clamp(M.scroll-B.index,0,1.6);
      B.tTilt.v[0]=lerp(K.mTilt,K.mFlat,smooth(Math.min(u,1))); B.tTilt.d=0;
      B.mFade=1-smooth(clamp((u-0.28)/0.5,0,1));
      B.gRoot.visible=B.mFade>0.01 && B.index-M.scroll<9.5;
    }
  }

  for(const B of books){
    B.tHover.update();B.tTilt.update();B.tActiveP.update();B.tActiveR.update();
    B.tScale.update();B.tRefl.update();B.tFade.update();B.tSeat.update();B.sWob.update(dt);
    B.gHover.position.set(B.tHover.v[0],B.tHover.v[1],B.tHover.v[2]);
    B.gTilt.rotation.set(B.tTilt.v[0],B.tTilt.v[1],B.tTilt.v[2]);
    B.gWob.rotation.set(B.sWob.v[0],B.sWob.v[1],B.sWob.v[2]);
    B.gRoot.position.set(B.tActiveP.v[0],B.tActiveP.v[1],B.tActiveP.v[2]);
    B.gRoot.rotation.set(B.tActiveR.v[0],B.tActiveR.v[1],B.tActiveR.v[2]);
    B.gScl.scale.setScalar(B.tScale.v[0]);
    const op=B.tFade.v[0]*wf*(MOBILE&&B.mFade!==undefined&&B!==S.active?B.mFade:1);
    B.clothMat.opacity=op; B.spineMat.uniforms.uOpacity.value=op;
    B.pages.uniforms.uOpacity.value=op;
    B.coverMat.uniforms.uOpacity.value=op;
    B.backMat.uniforms.uOpacity.value=op;
    if(!MOBILE){
      const lift=B.tHover.v[1], away=clamp((B.tHover.v[2]-B.base[2])/0.075,0,1);
      B.wallSh.position.x=B.basePos[0]-0.09-away*0.05;
      B.wallSh.position.y=B.basePos[1]+lift-0.04+away*0.02;
      B.wallSh.scale.setScalar((1+away*0.13)*(B.tScale.v[0]||0.0001));
      const seat=B.tSeat.v[0];                                   // 1 on the shelf, 0 in the hand
      B.wallSh.material.opacity=(0.50-away*0.15)*op*seat;
      B.cs.material.opacity=(0.92*(1-away*0.55))*op*seat;
      B.crease.material.opacity=(0.55*(1-away))*op*seat;
      B.reflMat.uniforms.uOpacity.value=B.tRefl.v[0]*op*seat;
      B.refl.position.z=K.bookZ+(SZH/2)*Math.sin(-B._lean)+0.24+B.tHover.v[2]*2;
    }
  }

  const wantBlur=(S.anim==='animatingForward'||S.anim==='active');
  if(blurTw._w!==wantBlur){blurTw._w=wantBlur;
    blurTw.i.start([wantBlur?16:0],460,t=>t,100);
    blurTw.n.start([wantBlur?6:1],400,t=>t,100);}
  blurTw.i.update();blurTw.n.update();

  const act=(S.anim==='animatingForward'||S.anim==='active'||S.anim==='animatingBackward');
  camera.layers.set(LAY_BG);
  renderer.setRenderTarget(rt);
  renderer.clear(true,true,false);
  renderer.render(scene,camera);
  renderer.setRenderTarget(null);
  passMat.uniforms.ignoreBlur.value=!act;
  passMat.uniforms.intensity.value=blurTw.i.v[0];
  passMat.uniforms.noiseScale.value=blurTw.n.v[0];
  renderer.clear(true,true,false);
  renderer.render(quadScene,quadCam);
  if(act){
    renderer.clearDepth();
    camera.layers.set(LAY_FG);
    renderer.render(scene,camera);
  }
}

/* ---- boot ---- */
const loader=document.getElementById('loader'), barfill=document.getElementById('barfill');
const setProgress=p=>barfill.style.transform=`scaleX(${p})`;
setProgress(0.06);
const frame=()=>new Promise(r=>{let done=false;const go=()=>{if(!done){done=true;r();}};
  requestAnimationFrame(go);setTimeout(go,34);});

(async function boot(){
  try { await loadPlates(); } catch(e){ console.warn('loadPlates error:', e); }
  for(let i=0; i<BOOKS.length; i++){
    try {
      books.push(buildBook(BOOKS[i], i));
    } catch(err) {
      console.error('Error building book', i, err);
    }
  }
  try {
    applyMode();
    resize(); washResize();
    setProgress(1);
    requestAnimationFrame(tick);
  } catch(err) {
    console.error('Error in applyMode/tick:', err);
  }
  if(loader) loader.classList.add('gone');
  if(canvas) canvas.classList.add('on');
  try { revealChrome(); } catch(e){}
  try {
    const foot = document.querySelector('footer');
    if(foot) foot.classList.add('on');
    if(mbar) mbar.classList.add('on');
  } catch(e){}
  try { startIntro(); } catch(e){ console.error('Intro error:', e); }
})();

// Failsafe: Ensure loader never blocks the canvas permanently
setTimeout(() => {
  const ld = document.getElementById('loader');
  const cv = document.getElementById('gl');
  if (ld) ld.classList.add('gone');
  if (cv) cv.classList.add('on');
  const foot = document.querySelector('footer');
  if (foot) foot.classList.add('on');
}, 2200);

</script>
